<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0e0d;
    --text: #f0ece4;
    --muted: #8a8478;
    --accent: #c9b99a;
    --line: rgba(201,185,154,0.2);

    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1.5rem;
    text-align: center;
    overflow-x: hidden;
  }

  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 480px;
    width: 100%;
    animation: fadeUp 1.2s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2.5rem;
    min-height: 14px;
  }

  .quote {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.2rem, 4.5vw, 1.6rem);
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 2.5rem;
    min-height: 6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    text-wrap: pretty;
    transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .quote.fading { opacity: 0; }

  .divider2 {
    width: 1px;
    height: 40px;
    background: var(--line);
    margin: 0 auto 2.5rem;
  }

  .message-hero {
    font-size: 1rem;
    line-height: 1.75;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }

  .message-hero strong {
    color: var(--text);
    font-weight: 400;
  }

  #kofi-wrap {
    transform: scale(0.85);
    transform-origin: center top;
    margin-bottom: 1rem;
    display: inline-block;
  }

  .footer {
    margin-top: 2rem;

    color: var(--muted);

function getLang() {
  const lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return content[lang] ? lang : 'en';
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function init() {
  const lang = getLang();
  const c = content[lang];

  document.documentElement.lang = lang;
  document.getElementById('eyebrow').textContent = c.eyebrow;
  document.getElementById('message-hero').innerHTML = c.messageHero;
  document.getElementById('footer').textContent = c.footer;

  const quoteEl = document.getElementById('quote');
  
  // Custom refined typographic fallback for CJK languages
  if (lang === 'ja' || lang === 'zh') {
    quoteEl.style.fontFamily = "'Playfair Display', 'Noto Serif CJK JP', 'Songti SC', 'Source Han Serif', serif";
    quoteEl.style.fontWeight = "400";
  }

  // Pick initial quote
  quoteEl.textContent = pickRandom(c.quotes);

  // Smooth interval rotation
  setInterval(() => {
    quoteEl.classList.add('fading');
    setTimeout(() => {
      let nextQuote;
      // Prevent picking the exact same quote twice in a row
      do {
        nextQuote = pickRandom(c.quotes);
      } while (nextQuote === quoteEl.textContent && c.quotes.length > 1);
      
      quoteEl.textContent = nextQuote;
      quoteEl.classList.remove('fading');
    }, 600); // Syncs with CSS fade transition duration
  }, 9000);
}

init();
