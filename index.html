<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You deserve happiness</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0e0d;
    --text: #f0ece4;
    --muted: #8a8478;
    --accent: #c9b99a;
    --line: rgba(201,185,154,0.2);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1.5rem;
    text-align: center;
    overflow-x: hidden;
  }

  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 480px;
    width: 100%;
    animation: fadeUp 1.2s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2.5rem;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--line);
    margin: 0 auto 2.5rem;
  }

  .quote {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.1rem, 4vw, 1.5rem);
    line-height: 1.55;
    color: var(--text);
    margin-bottom: 2.5rem;
    min-height: 4rem;
    transition: opacity 0.5s ease;
  }

  .quote.fading { opacity: 0; }

  .divider2 {
    width: 1px;
    height: 40px;
    background: var(--line);
    margin: 0 auto 2.5rem;
  }

  .message {
    font-size: 1rem;
    line-height: 1.75;
    color: var(--muted);
    margin-bottom: 2.8rem;
  }

  .message strong {
    color: var(--text);
    font-weight: 400;
  }

  .donate-btn {
    display: inline-block;
    padding: 14px 36px;
    border: 1px solid var(--accent);
    color: var(--accent);
    text-decoration: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: background 0.3s ease, color 0.3s ease;
    border-radius: 2px;
  }

  .donate-btn:hover {
    background: var(--accent);
    color: var(--bg);
  }

  .footer {
    margin-top: 3.5rem;
    font-size: 11px;
    color: var(--muted);
    opacity: 0.5;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">

  <p class="eyebrow" id="eyebrow">You are not alone</p>
  <div class="divider"></div>

  <p class="quote" id="quote"></p>

  <div class="divider2"></div>

  <p class="message" id="message">
    <strong>I'm rooting for you.</strong><br>
    You are not alone.<br><br>
    If you want to help me keep<br>supporting people like us:
  </p>

  <div id="kofi-wrap"></div>
  <script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script>
  <script type='text/javascript'>kofiwidget2.init('Keep this going ♥', '#3a9e7e', 'Z8Z71X8388');kofiwidget2.draw();</script>

  <p class="footer" id="footer">Every little bit helps. Thank you.</p>
</div>

    ],
    message: "<strong>I'm rooting for you.</strong><br>You are not alone.<br><br>If this helped, even just a little,<br>consider supporting me:",

      "Même les jours les plus sombres se terminent. Et tu es encore là.",
      "Tu n'as pas besoin de tout contrôler. Il suffit de faire le prochain petit pas.",

  },
  es: {

    quotes: [
      "Lo lograrás. No porque sea fácil, sino porque eres más fuerte de lo que crees.",
      "Incluso los días más oscuros terminan. Y tú sigues aquí.",

  pt: {

      "Você é suficiente. Exatamente como você é, agora.",
      "As tempestades passam. Esta também vai."
    ],
    message: "<strong>Estou torcendo por você.</strong><br>Você não está sozinho/a.<br><br>Se isso ajudou, mesmo que um pouco,<br>considere me apoiar:",
    footer: "Cada contribuição ajuda. Obrigado."
  }
};

function getLang() {
  const lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return content[lang] ? lang : 'en';
}

function nl2br(str) {
  return str.replace(/\n/g, '<br>');
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function init() {
  const lang = getLang();
  const c = content[lang];

  document.documentElement.lang = lang;
  document.getElementById('eyebrow').textContent = c.eyebrow;
  document.getElementById('message').innerHTML = c.message;
  document.getElementById('footer').textContent = c.footer;

  const quoteEl = document.getElementById('quote');
  quoteEl.textContent = pickRandom(c.quotes);

  setInterval(() => {
    quoteEl.classList.add('fading');
    setTimeout(() => {
      quoteEl.textContent = pickRandom(c.quotes);
      quoteEl.classList.remove('fading');
    }, 500);
  }, 8000);
}

init();
</script>
</body>
</html>
